name: Feature request
description: Propose a new feature or a change to existing behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why Mira makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, including config or syntax if relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you have tried, or other ways to solve the problem.
