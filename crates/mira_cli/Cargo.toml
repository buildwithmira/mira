[package]
name = "mira"
description = "The mira command line tool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
mira_compiler = { version = "0.2.0", path = "../mira_compiler" }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"

# HTTPS for `mira mcp --url`. Windows and macOS use the system TLS library,
# and other platforms use rustls, so no build needs OpenSSL or a C compiler
# for cryptography on Windows.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
